services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__TemplateConnection=Host=db;Port=5432;Database=SunyaSuite;Username=postgres;Password=${POSTGRES_PASSWORD:?err}
      - ConnectionStrings__ConfigConnection=Host=db;Port=5432;Database=SunyaSuite_Config;Username=postgres;Password=${POSTGRES_PASSWORD:?err}
      - Email__SmtpHost=${EMAIL_SMTP_HOST:-smtp.gmail.com}
      - Email__SmtpPort=${EMAIL_SMTP_PORT:-587}
      - Email__Username=${EMAIL_USERNAME}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS:-noreply@sunya.local}
      - Email__FromName=${EMAIL_FROM_NAME:-SunyaSuite}
      - Jwt__Secret=${JWT_SECRET:?err}
      - Jwt__Issuer=SunyaSuite
      - Jwt__Audience=SunyaSuiteClient
      - SeedData__AdminEmail=${ADMIN_EMAIL:-admin@sunya.local}
      - SeedData__AdminPassword=${ADMIN_PASSWORD:?err}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

  db:
    image: postgres:18
    environment:
      - POSTGRES_DB=SunyaSuite
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  seq:
    image: datalust/seq:latest
    container_name: sunya-seq
    ports:
      - "5341:80"
      - "5342:5341"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_FIRSTRUN_ADMINPASSWORD:?err}
      - TZ=Asia/Kathmandu
    volumes:
      - seq-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  seq-data: